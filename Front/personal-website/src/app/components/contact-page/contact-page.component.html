<div class="d-flex flex-column align-items-center justify-content-center p-3 p-md-5 p-lg-5">
  <div class="col-12 col-md-12 col-lg-5 pt-4">
    <div class="d-flex flex-column align-items-center p-5 whole-card mb-5">
      <h2 class="pb-4">Me contacter</h2>
      <form #contactForm="ngForm" (ngSubmit)="onSubmitForm(contactForm)" class="d-flex flex-column col-8 align-items-center">

        <mat-form-field class="col-10">
          <mat-label>Nom</mat-label>
          <input matInput type="text" name="name" ngModel required>
        </mat-form-field>

        <mat-form-field class="col-10">
          <mat-label>Email</mat-label>
          <input matInput type="email" name="email" placeholder="Ex. nom@exemple.com" ngModel required>
        </mat-form-field>

        <mat-form-field class="col-10 pb-4">
          <mat-label>Message</mat-label>
          <textarea matInput name="message" ngModel required></textarea>
        </mat-form-field>

        <button type="submit" [disabled]="!contactForm.valid" class="col-5">Envoyer</button>

      </form>
    </div>
  </div>
</div>
