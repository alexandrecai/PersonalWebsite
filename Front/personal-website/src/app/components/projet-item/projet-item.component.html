<div class="d-flex flex-column flex-md-row flex-lg-row p-5 align-items-center whole-card mb-5">
  <div>
    <h2 class="pb-3">{{ projet.name }}</h2>
    <p class="pb-3  col-11">{{ projet.description }}</p>
    <h4>Contributeurs</h4>
    <div class="d-flex d-inline pb-4">
      <mat-chip-set>
        @for (name of projet.contributors; track projet.contributors){
          <mat-chip>{{ name }}</mat-chip>

        }
      </mat-chip-set>
    </div>
    <h4>Technologies</h4>
    <div class="d-flex d-inline">
      <mat-chip-set>
        @for (tec of projet.technos; track projet.technos){
          <mat-chip highlighted>{{ tec }}</mat-chip>
        }
      </mat-chip-set>
    </div>
  </div>
  <div class="mt-4 mt-lg-0 mt-md-0 ms-md-4 ms-lg-0">
    <img [ngSrc]=projet.imageUrl alt="logo" width="200" height="200">

    <div *ngIf="projet.git" class="mt-2 d-flex align-items-center justify-content-center pt-3">
      <a [href]=projet.git class="git-button-text  p-2 ">
        <div class="d-flex align-items-center justify-content-center flex-column">
          <img ngSrc="/git.png" alt="git" width="50" height="50" class="">
          <h4 class="">Code source</h4>
        </div>

      </a>
    </div>

  </div>
</div>
